name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: privacy_feedback_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d privacy_feedback_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-for-production-0123456789
      DATABASE_URL: postgresql+psycopg://ci_user:ci_test_password@127.0.0.1:5432/privacy_feedback_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e "services/api[dev]"

      - name: Ruff lint
        run: ruff check --output-format=github services/api

      - name: Ruff format check
        run: ruff format --check services/api

      - name: Apply database migrations
        run: alembic -c services/api/alembic.ini upgrade head

      - name: Test with coverage
        run: pytest services/api

      - name: Dependency audit
        run: python -m pip_audit

  api-image:
    name: API container build
    runs-on: ubuntu-latest
    needs: api-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t privacy-feedback-api:ci services/api

  client-quality:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: flutter --version

      - name: Resolve Flutter dependencies
        working-directory: apps/client
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: apps/client
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/client
        run: flutter test --coverage
