name: Credential metadata retention

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-metadata-retention
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/api

    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}
      CREDENTIAL_METADATA_RETENTION_DAYS: "30"
      DATABASE_POOL_RECYCLE_SECONDS: "300"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API runtime dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Create ephemeral maintenance JWT setting
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print("JWT_SECRET=" + secrets.token_urlsafe(48))
          PY

      - name: Validate required database secret
        shell: bash
        run: |
          test -n "$DATABASE_URL"

      - name: Preview retention purge
        run: python -m app.maintenance --dry-run

      - name: Purge expired credential metadata
        run: python -m app.maintenance
