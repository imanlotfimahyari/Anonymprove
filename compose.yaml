services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-privacy_feedback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-privacy_feedback}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-privacy_feedback} -d ${POSTGRES_DB:-privacy_feedback}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./services/api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_JOIN_MAX_REQUESTS: ${RATE_LIMIT_JOIN_MAX_REQUESTS:-10}
      RATE_LIMIT_GROUP_CREATE_MAX_REQUESTS: ${RATE_LIMIT_GROUP_CREATE_MAX_REQUESTS:-5}
      RATE_LIMIT_ROUND_CREATE_MAX_REQUESTS: ${RATE_LIMIT_ROUND_CREATE_MAX_REQUESTS:-10}
      RATE_LIMIT_CREDENTIAL_CLAIM_MAX_REQUESTS: ${RATE_LIMIT_CREDENTIAL_CLAIM_MAX_REQUESTS:-5}
      REQUEST_LOGGING_ENABLED: ${REQUEST_LOGGING_ENABLED:-true}
      CREDENTIAL_METADATA_RETENTION_DAYS: ${CREDENTIAL_METADATA_RETENTION_DAYS:-30}
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-*}"
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-privacy_feedback}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-privacy_feedback}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic -c alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --no-server-header --no-date-header"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
